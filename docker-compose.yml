version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: education_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=EducationCenterDB;Username=postgres;Password=YOUR_DB_PASSWORD;Pooling=true;MinPoolSize=1;MaxPoolSize=20;
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: education_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YOUR_DB_PASSWORD
      - POSTGRES_DB=EducationCenterDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
